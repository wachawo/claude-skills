name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to use for the artifact name (e.g. v0.2.0).'
        required: false
        default: 'nightly'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sanity check
        run: |
          python3 -m py_compile claude-skills.py
          shopt -s nullglob
          test -d skills || { echo "skills/ missing"; exit 1; }
          mapfile -t skill_files < <(ls skills/*/SKILL.md 2>/dev/null)
          if [ "${#skill_files[@]}" -eq 0 ]; then
            echo "no skills/<name>/SKILL.md found"
            exit 1
          fi
          echo "Found ${#skill_files[@]} skills."

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build archives
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          NAME="claude-skills-${VERSION}"
          mkdir -p "dist/${NAME}"
          cp -r skills "dist/${NAME}/"
          cp claude-skills.py README.md INSTALL.md "dist/${NAME}/"
          if [ -f docs/README_RU.md ]; then
            mkdir -p "dist/${NAME}/docs"
            cp docs/README_RU.md "dist/${NAME}/docs/"
          fi
          (cd dist && tar -czf "${NAME}.tar.gz" "${NAME}")
          (cd dist && zip -qr "${NAME}.zip" "${NAME}")
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-skills-${{ steps.version.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
