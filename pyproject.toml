[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-skills"
version = "0.0.1"
description = "Curated catalog of Claude Code skills with an interactive installer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "wachawo" }]
keywords = ["claude", "claude-code", "skills", "agent", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
claude-skills = "claude_skills.cli:main"

[project.urls]
Homepage = "https://github.com/wachawo/claude-skills"
Source   = "https://github.com/wachawo/claude-skills"
Issues   = "https://github.com/wachawo/claude-skills/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "claude_skills/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["claude_skills"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise FileNotFoundError",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/claude_skills",
    "skills",
    "README.md",
    "INSTALL.md",
    "LICENSE",
    "pyproject.toml",
]
